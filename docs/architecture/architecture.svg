ffff" stroke="#1b2a4a" stroke-width="1.6"/><text x="1100.0" y="592.0" font-size="16" font-weight="700" fill="#1b2a4a" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">Database</text><text x="1100.0" y="613.0" font-size="13.5" font-weight="400" fill="#46597f" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">sessions, quotes, orders, consent,</text><text x="1100.0" y="634.0" font-size="13.5" font-weight="400" fill="#46597f" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">audit; SQLite now, PostgreSQL later</text><rect x="1260" y="566" width="280" height="84" rx="10" fill="#ffffff" stroke="#1b2a4a" stroke-width="1.6"/><text x="1400.0" y="592.0" font-size="16" font-weight="700" fill="#1b2a4a" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">Lead model</text><text x="1400.0" y="613.0" font-size="13.5" font-weight="400" fill="#46597f" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">trained offline on history;</text><text x="1400.0" y="634.0" font-size="13.5" font-weight="400" fill="#46597f" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">re-validate on real data</text><line x1="500.0" y1="518" x2="500.0" y2="564" stroke="#46597f" stroke-width="1.8" marker-end="url(#a)"/><line x1="744" y1="518" x2="744" y2="564" stroke="#46597f" stroke-width="1.8" marker-end="url(#a)"/><line x1="1100.0" y1="518" x2="1100.0" y2="564" stroke="#46597f" stroke-width="1.8" marker-end="url(#a)"/><line x1="1400.0" y1="518" x2="1400.0" y2="564" stroke="#46597f" stroke-width="1.8" marker-end="url(#a)"/><rect x="20" y="680" width="1560" height="150" rx="14" fill="#f3f5f8" stroke="#dde2ea"/><text x="40" y="704" font-size="14" font-weight="700" fill="#5b6475" text-anchor="start" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">Outside services</text><rect x="60" y="712" width="280" height="100" rx="10" fill="#ffffff" stroke="#46597f" stroke-width="1.6" stroke-dasharray="6 5"/><text x="200.0" y="746.0" font-size="16" font-weight="700" fill="#1b2a4a" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">LLM provider API</text><text x="200.0" y="767.0" font-size="13.5" font-weight="400" fill="#46597f" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">only if a key is configured;</text><text x="200.0" y="788.0" font-size="13.5" font-weight="400" fill="#46597f" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">never sees documents</text><rect x="660" y="712" width="280" height="100" rx="10" fill="#fff4d6" stroke="#8a5a00" stroke-width="1.6" stroke-dasharray="7 5"/><text x="800.0" y="746.0" font-size="16" font-weight="700" fill="#1b2a4a" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">MOCK GST + Udyam registry</text><text x="800.0" y="767.0" font-size="13.5" font-weight="400" fill="#46597f" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">local, built from the synthetic</text><text x="800.0" y="788.0" font-size="13.5" font-weight="400" fill="#46597f" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">CSVs. Not a government API.</text><rect x="960" y="712" width="580" height="100" rx="10" fill="#ffffff" stroke="#8a5a00" stroke-width="1.6" stroke-dasharray="3 4"/><text x="1250.0" y="746.0" font-size="16" font-weight="700" fill="#1b2a4a" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">Production: swap the mock adapter for these (not called today)</text><text x="1250.0" y="767.0" font-size="13.5" font-weight="400" fill="#5b6475" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">GSP for GSTN, Udyam data source, DigiLocker / Entity Locker via API Setu,</text><text x="1250.0" y="788.0" font-size="13.5" font-weight="400" fill="#5b6475" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">eSign service provider, SMS gateway, UPI AutoPay</text><line x1="200.0" y1="518" x2="200.0" y2="710" stroke="#46597f" stroke-width="1.8" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="206.0" y="614.0" font-size="12.5" fill="#5b6475" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif" text-anchor="start" paint-order="stroke" stroke="#f3f5f8" stroke-width="4">text only, PII masked</text><line x1="890" y1="518" x2="890" y2="710" stroke="#46597f" stroke-width="1.8" marker-end="url(#a)"/><line x1="940" y1="762.0" x2="958" y2="762.0" stroke="#46597f" stroke-width="1.8" stroke-dasharray="4 4" marker-end="url(#a)"/><text x="500.0" y="752" font-size="15" font-weight="700" fill="#8a5a00" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">Engine and KYC decide.</text><text x="500.0" y="774" font-size="13.5" font-weight="400" fill="#5b6475" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">The model and the LLM only assist;</text><text x="500.0" y="792" font-size="13.5" font-weight="400" fill="#5b6475" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">with no key the advisor runs offline.</text><rect x="60" y="846" width="16" height="12" fill="#1b2a4a"/><text x="84" y="856" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">decides (deterministic rules)</text><rect x="290" y="846" width="16" height="12" fill="#fff4d6" stroke="#8a5a00" stroke-dasharray="4 3"/><text x="314" y="856" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">mock built from synthetic data</text><rect x="530" y="846" width="16" height="12" fill="#ffffff" stroke="#46597f" stroke-dasharray="4 3"/><text x="554" y="856" font-size="12.5" font-weight="400" fill="#5b6475" text-anchor="start" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">optional, or production-only</text></svg>