I', Arial, sans-serif">API: one FastAPI service, separate modules</text><rect x="60" y="300" width="1480" height="56" rx="10" fill="#ffffff" stroke="#1b2a4a" stroke-width="1.6"/><text x="800.0" y="322.5" font-size="16" font-weight="700" fill="#1b2a4a" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">Security layer</text><text x="800.0" y="343.5" font-size="13.5" font-weight="400" fill="#46597f" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">OTP + JWT sessions, five roles, per-session secret for the advisor, rate limits, security headers, PII-scrubbed logs, audit trail</text><line x1="530" y1="240" x2="530" y2="298" stroke="#46597f" stroke-width="1.8" marker-end="url(#a)"/><text x="536.0" y="269.0" font-size="12.5" fill="#5b6475" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif" text-anchor="start" paint-order="stroke" stroke="#f3f5f8" stroke-width="4">HTTPS, JSON</text><line x1="1220" y1="240" x2="1220" y2="298" stroke="#46597f" stroke-width="1.8" marker-end="url(#a)"/><text x="1226.0" y="269.0" font-size="12.5" fill="#5b6475" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif" text-anchor="start" paint-order="stroke" stroke="#f3f5f8" stroke-width="4">HTTPS, JSON</text><rect x="60" y="392" width="280" height="126" rx="10" fill="#ffffff" stroke="#1b2a4a" stroke-width="1.6"/><text x="200.0" y="428.5" font-size="16" font-weight="700" fill="#1b2a4a" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">Advisor</text><text x="200.0" y="449.5" font-size="13.5" font-weight="400" fill="#46597f" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">understands EN, Hinglish, Hindi;</text><text x="200.0" y="470.5" font-size="13.5" font-weight="400" fill="#46597f" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">asks only what is missing;</text><text x="200.0" y="491.5" font-size="13.5" font-weight="400" fill="#46597f" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">optional LLM: text only</text><rect x="360" y="392" width="280" height="126" rx="10" fill="#1b2a4a" stroke="#1b2a4a" stroke-width="1.6"/><text x="500.0" y="428.5" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">Deterministic engine</text><text x="500.0" y="449.5" font-size="13.5" font-weight="400" fill="#d6dcea" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">catalogue rules, eligibility,</text><text x="500.0" y="470.5" font-size="13.5" font-weight="400" fill="#d6dcea" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">recommendation, one price per</text><text x="500.0" y="491.5" font-size="13.5" font-weight="400" fill="#d6dcea" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">product, GST, install plan</text><rect x="660" y="392" width="280" height="126" rx="10" fill="#1b2a4a" stroke="#1b2a4a" stroke-width="1.6"/><text x="800.0" y="428.5" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">Smart KYC</text><text x="800.0" y="449.5" font-size="13.5" font-weight="400" fill="#d6dcea" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">upload checks, deskew, blur,</text><text x="800.0" y="470.5" font-size="13.5" font-weight="400" fill="#d6dcea" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">watermark removal, OCR ensemble,</text><text x="800.0" y="491.5" font-size="13.5" font-weight="400" fill="#d6dcea" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">cross-checks, 3-way decision</text><rect x="960" y="392" width="280" height="126" rx="10" fill="#ffffff" stroke="#1b2a4a" stroke-width="1.6"/><text x="1100.0" y="428.5" font-size="16" font-weight="700" fill="#1b2a4a" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">Orders and privacy</text><text x="1100.0" y="449.5" font-size="13.5" font-weight="400" fill="#46597f" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">re-prices the quote at checkout,</text><text x="1100.0" y="470.5" font-size="13.5" font-weight="400" fill="#46597f" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">payment retry, tracker, consent</text><text x="1100.0" y="491.5" font-size="13.5" font-weight="400" fill="#46597f" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">and withdrawal, call-backs</text><rect x="1260" y="392" width="280" height="126" rx="10" fill="#ffffff" stroke="#1b2a4a" stroke-width="1.6"/><text x="1400.0" y="428.5" font-size="16" font-weight="700" fill="#1b2a4a" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">Routing + lead score</text><text x="1400.0" y="449.5" font-size="13.5" font-weight="400" fill="#46597f" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">calibrated logistic regression;</text><text x="1400.0" y="470.5" font-size="13.5" font-weight="400" fill="#46597f" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">self-serve, assisted, partner,</text><text x="1400.0" y="491.5" font-size="13.5" font-weight="400" fill="#46597f" text-anchor="middle" font-family="Carlito, Calibri, 'Segoe UI', Arial, sans-serif">field sales or KYC review</text><line x1="200.0" y1="356" x2="200.0" y2="390" stroke="#46597f" stroke-width="1.8" marker-end="url(#a)"/><line x1="500.0" y1="356" x2="500.0" y2="390" stroke="#46597f" stroke-width="1.8" marker-end="url(#a)"/><line x1="800.0" y1="356" x2="800.0" y2="390" stroke="#46597f" stroke-width="1.8" marker-end="url(#a)"/><line x1="1100.0" y1="356" x2="1100.0" y2="390" strok